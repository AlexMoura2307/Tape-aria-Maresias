<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tapeçaria Maresias</title><style>
*{box-sizing:border-box}body{margin:0;font:16px Arial,sans-serif;background:#f3f6f8;color:#12304e}header{background:#0b2944;color:#f3d7a0;padding:20px;text-align:center}header h1{margin:0;font-size:24px}nav{display:flex;position:sticky;top:0;background:#fff;padding:8px;gap:8px;z-index:2}button{cursor:pointer;border:1px solid #bed0db;background:#fff;color:#103452;padding:12px;border-radius:10px;font-weight:bold}button.primary{background:#154a73;color:#fff}.wrap{max-width:850px;margin:16px auto;padding:0 12px}.panel{background:#fff;padding:18px;border-radius:14px;margin-bottom:14px;border:1px solid #d8e1e8}h2{margin-top:0}label{display:block;font-weight:600;margin:16px 0 5px}input,textarea,select{padding:12px;font:inherit;border:1px solid #bacbd7;border-radius:9px;width:100%;background:#fff}textarea{min-height:105px}.withMic{display:flex;gap:8px}.withMic textarea,.withMic input{flex:1;min-width:0}.mic{min-width:48px;font-size:20px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.muted{color:#667788}.warn{padding:10px;background:#fff3dc;border-radius:8px}.item{padding:14px;border-bottom:1px solid #eee}.item:last-child{border:0}.hidden{display:none}.option{border:1px solid #ddd;border-radius:10px;padding:12px;margin:12px 0}@media print{nav,.noprint,.wrap{display:none!important}#paper{display:block!important}body{background:white}#paper{padding:22px;font:14px Georgia,serif;color:#0e2d48}#paper header{border-bottom:4px solid #c0a16a}#paper footer{position:fixed;bottom:10px;left:20px;right:20px;border-top:2px solid #c0a16a;padding:10px;text-align:center}#paper section{break-inside:avoid;margin:18px 0}#paper h3{color:#0e2d48;border-bottom:1px solid #c0a16a;padding-bottom:5px}}#paper{display:none}</style></head><body>
<header><h1>TAPEÇARIA MARESIAS</h1><small>Orçamentos e controle de serviços</small></header><nav><button onclick="home()">📋 Orçamentos</button><button onclick="start()">＋ Novo orçamento</button><button onclick="settings()">⚙ Empresa</button></nav>
<main class="wrap"><div id="msg" class="hidden warn"></div><div id="view"></div></main><div id="paper"></div>
<script>
const KEY='maresias_v4_data',CFG='maresias_v4_company';let entries=JSON.parse(localStorage.getItem(KEY)||'[]'),config=JSON.parse(localStorage.getItem(CFG)||'{}'),current=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){localStorage.setItem(KEY,JSON.stringify(entries))}
function message(s){const m=document.getElementById('msg');m.textContent=s;m.classList.remove('hidden')}
function field(name,label,val='',large=false,mic=true){let input=large?'<textarea id="'+name+'">'+esc(val)+'</textarea>':'<input id="'+name+'" value="'+esc(val)+'">';return '<label for="'+name+'">'+label+'</label><div class="withMic">'+input+(mic?'<button type="button" class="mic" aria-label="Ditar '+label+'" onclick="dictate(\''+name+'\',this)">🎙️</button>':'')+'</div>'}
function dictate(id,btn){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;let target=document.getElementById(id);if(!target)return;if(!window.isSecureContext){message('O ditado requer HTTPS. Abra o endereço publicado no Render, não um arquivo baixado.');return}if(!SR){message('O reconhecimento de voz não é compatível com este navegador. Use Chrome atualizado ou microfone do teclado.');return}let rec=new SR();rec.lang='pt-BR';rec.interimResults=false;rec.continuous=false;btn.textContent='🔴';rec.onresult=e=>{const s=Array.from(e.results).map(r=>r[0].transcript).join(' ');target.value=(target.value.trim()+' '+s).trim();target.dispatchEvent(new Event('input'));message('Texto reconhecido. Confira antes de salvar.')};rec.onerror=e=>message('Microfone: '+e.error+'. Verifique permissão do site no Chrome.');rec.onend=()=>btn.textContent='🎙️';try{rec.start()}catch(e){message('Não foi possível iniciar o microfone: '+e.message)}}
function home(){current=null;document.getElementById('view').innerHTML='<div class="panel"><h2>Orçamentos e serviços</h2><p class="muted">Dados armazenados neste navegador. Faça backups regularmente.</p><div class="actions noprint"><button onclick="start()" class="primary">＋ Novo orçamento</button><button onclick="backup()">Exportar backup</button><button onclick="document.getElementById(\'import\').click()">Importar backup</button><input id="import" class="hidden" type="file" accept=".json" onchange="importBackup(this)"></div>'+entries.map(e=>'<div class="item"><b>Nº '+esc(e.id)+' — '+esc(e.cliente)+'</b><p>'+esc(e.local||'')+' · '+esc(e.status)+'</p><button onclick="edit('+e.id+')">Abrir / Editar</button> <button onclick="printBudget('+e.id+')">PDF</button></div>').join('')+'</div>'}
function fresh(){return{id:Math.max(0,...entries.map(e=>Number(e.id)||0))+1,status:'Em elaboração',data:new Date().toISOString().slice(0,10),options:[{servico:'',material:'',valor:''}]}}
function start(){editForm(fresh())}function edit(id){let e=entries.find(x=>x.id===id);if(e)editForm(e)}
function editForm(e){current=structuredClone(e);document.getElementById('msg').classList.add('hidden');document.getElementById('view').innerHTML='<div class="panel"><h2>Orçamento Nº '+e.id+'</h2>'+field('cliente','Nome do cliente',e.cliente||'')+field('telefone','Telefone / WhatsApp',e.telefone||'',false,false)+field('responsavel','A/C (responsável)',e.responsavel||'')+field('local','Local / condomínio',e.local||'')+field('endereco','Endereço do serviço',e.endereco||'')+'<label>Data do orçamento</label><input id="data" type="date" value="'+esc(e.data||'')+'"><label>Status</label><select id="status">'+['Em elaboração','Enviado','Aprovado','Em andamento','Concluído','Recusado'].map(s=>'<option '+(s===e.status?'selected':'')+'>'+s+'</option>').join('')+'</select><h3>Propostas de orçamento</h3><div id="options"></div><button type="button" onclick="addOption()">＋ Adicionar opção</button>'+field('prazo','Prazo de entrega',e.prazo||'')+field('pagamento','Condições de pagamento',e.pagamento||'',true)+field('observacoes','Observações',e.observacoes||'',true)+'<div class="actions"><button class="primary" onclick="save()">Salvar orçamento</button><button onclick="save();printBudget(current.id)">Gerar PDF</button><button onclick="home()">Voltar</button></div></div>';renderOptions()}
function captureOptions(){current.options=current.options.map((o,i)=>({servico:document.getElementById('servico'+i)?.value??o.servico,material:document.getElementById('material'+i)?.value??o.material,valor:document.getElementById('valor'+i)?.value??o.valor}))}
function renderOptions(){document.getElementById('options').innerHTML=current.options.map((o,i)=>'<div class="option"><h3>Orçamento '+(i+1)+'</h3>'+field('servico'+i,'Serviço a ser realizado',o.servico,true)+field('material'+i,'Material / tecido / cor / quantidade',o.material,true)+field('valor'+i,'Valor total (R$)',o.valor,false,false)+'</div>').join('')}
function addOption(){captureOptions();current.options.push({servico:'',material:'',valor:''});renderOptions()}
function save(){if(!current)return false;captureOptions();for(const n of ['cliente','telefone','responsavel','local','endereco','data','status','prazo','pagamento','observacoes'])current[n]=document.getElementById(n).value;if(!current.cliente.trim()){message('Preencha o nome do cliente.');return false}let i=entries.findIndex(e=>e.id===current.id);if(i<0)entries.push(structuredClone(current));else entries[i]=structuredClone(current);persist();message('Orçamento salvo com sucesso.');return true}
function printBudget(id){let e=entries.find(x=>x.id===id);if(!e)return;let txt=s=>esc(s).replace(/\n/g,'<br>');document.getElementById('paper').innerHTML='<header><h1>TAPEÇARIA MARESIAS</h1><p>ORÇAMENTO Nº '+e.id+'</p></header><section><b>Cliente:</b> '+esc(e.cliente)+'<br><b>A/C:</b> '+esc(e.responsavel)+'<br><b>Local:</b> '+esc(e.local)+'<br><b>Endereço:</b> '+esc(e.endereco)+'<br><b>Data:</b> '+esc(e.data)+'</section>'+e.options.map((o,i)=>'<section><h3>ORÇAMENTO '+(i+1)+' — SERVIÇO A SER REALIZADO</h3><p>'+txt(o.servico)+'</p><h3>MATERIAL A SER UTILIZADO</h3><p>'+txt(o.material)+'</p><h3>MATERIAL + MÃO DE OBRA: R$ '+esc(o.valor)+'</h3></section>').join('')+'<section><b>Prazo:</b> '+esc(e.prazo)+'<br><b>Condições de pagamento:</b> '+txt(e.pagamento)+'<br><b>Observações:</b> '+txt(e.observacoes)+'</section><footer>'+esc(config.telefone||'Telefone a informar')+' | '+esc(config.endereco||'Endereço a informar')+'</footer>';window.print()}
function settings(){document.getElementById('view').innerHTML='<div class="panel"><h2>Dados da empresa</h2>'+field('companyPhone','Telefone / WhatsApp',config.telefone||'',false,false)+field('companyAddress','Endereço para rodapé',config.endereco||'',true,false)+'<div class="actions"><button class="primary" onclick="config={telefone:document.getElementById(\'companyPhone\').value,endereco:document.getElementById(\'companyAddress\').value};localStorage.setItem(CFG,JSON.stringify(config));home()">Salvar</button></div></div>'}
function backup(){let blob=new Blob([JSON.stringify({entries,config},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-tapecaria-maresias.json';a.click();URL.revokeObjectURL(a.href)}
function importBackup(inp){let f=inp.files?.[0];if(!f)return;f.text().then(t=>{let d=JSON.parse(t);if(!Array.isArray(d.entries)||!confirm('Importar backup e substituir os dados deste aparelho?'))return;entries=d.entries;config=d.config||{};persist();localStorage.setItem(CFG,JSON.stringify(config));home()}).catch(()=>message('Arquivo de backup inválido.'))}
home();
</script></body></html>
