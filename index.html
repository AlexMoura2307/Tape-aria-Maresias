<header><h1>MARESIAS RESTAURAÇÕES DE ESTOFADOS</h1><small>Orçamentos e controle de serviços</small></header><nav><button onclick="home()">📋 Orçamentos</button><button onclick="start()">＋ Novo orçamento</button><button onclick="settings()">⚙ Empresa</button></nav>
<main class="wrap"><div id="msg" class="hidden warn"></div><div id="view"></div></main><div id="paper"></div>
<script>
const KEY='maresias_v4_data',CFG='maresias_v4_company';let entries=JSON.parse(localStorage.getItem(KEY)||'[]'),config=JSON.parse(localStorage.getItem(CFG)||'{}'),current=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){localStorage.setItem(KEY,JSON.stringify(entries))}
function message(s){const m=document.getElementById('msg');m.textContent=s;m.classList.remove('hidden')}
function field(name,label,val='',large=false,mic=true){let input=large?'<textarea id="'+name+'">'+esc(val)+'</textarea>':'<input id="'+name+'" value="'+esc(val)+'">';return '<label for="'+name+'">'+label+'</label><div class="withMic">'+input+(mic?'<button type="button" class="mic" aria-label="Ditar '+label+'" onclick="dictate(\''+name+'\',this)">🎙️</button>':'')+'</div>'}
let activeRecognition=null,activeMicButton=null;
function resetMic(){if(activeMicButton){activeMicButton.textContent='🎙️';activeMicButton.setAttribute('aria-pressed','false')}activeRecognition=null;activeMicButton=null}
function dictate(id,btn){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition, target=document.getElementById(id);
 if(!target)return;
 if(activeRecognition){const previous=activeRecognition;previous._userStopped=true;previous.stop();if(activeMicButton===btn){message('Ditado encerrado. Confira o texto.');return}}
 if(!window.isSecureContext){message('Abra pelo link HTTPS do Render, e não pelo arquivo baixado.');return}
 if(!SR){message('Este navegador não disponibiliza reconhecimento de voz. Abra no Chrome diretamente ou use o microfone do teclado Android.');return}
 const rec=new SR();activeRecognition=rec;activeMicButton=btn;rec.lang='pt-BR';rec.interimResults=false;rec.continuous=false;rec.maxAlternatives=1;
 btn.textContent='⏳';btn.setAttribute('aria-pressed','true');
 rec.onstart=()=>{if(activeRecognition===rec){btn.textContent='🔴';message('Ouvindo... Fale agora. Toque de novo para encerrar.')}};
 rec.onresult=e=>{if(activeRecognition!==rec)return;const t=Array.from(e.results).map(r=>r[0].transcript).join(' ');target.value=target.value.trimEnd()+(target.value.trim()?'\n':'')+t;target.dispatchEvent(new Event('input',{bubbles:true}));message('Texto reconhecido. Confira antes de salvar.')};
 rec.onerror=e=>{
   if(activeRecognition!==rec)return;
   const explanations={
    'not-allowed':'Acesso ao microfone negado. No Chrome, abra Configurações do site e permita Microfone.',
    'service-not-allowed':'O serviço de reconhecimento de voz foi bloqueado neste navegador.',
    'audio-capture':'O Chrome não conseguiu captar o áudio. Verifique se outro aplicativo está usando o microfone.',
    'network':'O serviço de reconhecimento de voz não conseguiu se conectar. Verifique sua internet.',
    'no-speech':'Nenhuma fala foi detectada. Toque no microfone e tente novamente.',
    'language-not-supported':'O reconhecimento de voz em português não está disponível neste aparelho.',
    'aborted':'O reconhecimento foi interrompido. Abra o link no Chrome diretamente (não no navegador interno do ChatGPT/WhatsApp) e tente novamente.'
   };
   message(rec._userStopped?'Ditado encerrado.':(explanations[e.error]||('Falha no reconhecimento: '+e.error)));
 };
 rec.onend=()=>{if(activeRecognition===rec)resetMic()};
 try{rec.start()}catch(e){resetMic();message('Não foi possível iniciar o ditado: '+e.message)}
}
function home(){document.getElementById('paper').classList.remove('preview-active');current=null;document.getElementById('view').innerHTML='<div class="panel"><h2>Orçamentos e serviços</h2><p class="muted">Dados armazenados neste navegador. Faça backups regularmente.</p><div class="actions noprint"><button onclick="start()" class="primary">＋ Novo orçamento</button><button onclick="backup()">Exportar backup</button><button onclick="document.getElementById(\'import\').click()">Importar backup</button><input id="import" class="hidden" type="file" accept=".json" onchange="importBackup(this)"></div>'+entries.map(e=>'<div class="item"><b>Nº '+esc(e.id)+' — '+esc(e.cliente)+'</b><p>'+esc(e.local||'')+' · '+esc(e.status)+'</p><button onclick="edit('+e.id+')">Abrir / Editar</button> <button onclick="printBudget('+e.id+')">Pré-visualizar</button> <button type="button" onclick="deleteBudget('+e.id+')" style="color:#9b2424;border-color:#dcb5b5">🗑 Excluir</button></div>').join('')+'</div>'}
function deleteBudget(id){
 const item=entries.find(e=>Number(e.id)===Number(id));if(!item)return;
 if(!confirm('Excluir definitivamente o orçamento Nº '+item.id+' — '+item.cliente+'? Esta ação não poderá ser desfeita.'))return;
 entries=entries.filter(e=>Number(e.id)!==Number(id));persist();home();message('Orçamento Nº '+id+' excluído.');
}
function fresh(){return{id:Math.max(0,...entries.map(e=>Number(e.id)||0))+1,status:'Em elaboração',data:new Date().toISOString().slice(0,10),prazo:'Até 15 dias úteis',observacoes:'Válido por 10 dias.',options:[{servico:'',material:'',valor:''}]}}
function start(){editForm(fresh())}function edit(id){let e=entries.find(x=>x.id===id);if(e)editForm(e)}
function editForm(e){document.getElementById('paper').classList.remove('preview-active');current=structuredClone(e);document.getElementById('msg').classList.add('hidden');document.getElementById('view').innerHTML='<div class="panel"><h2>Orçamento Nº '+e.id+'</h2>'+field('cliente','Nome do cliente',e.cliente||'')+field('telefone','Telefone / WhatsApp',e.telefone||'',false,false)+field('local','Local / condomínio',e.local||'')+field('endereco','Endereço do serviço',e.endereco||'')+'<label>Data do orçamento</label><input id="data" type="date" value="'+esc(e.data||'')+'"><label>Status</label><select id="status">'+['Em elaboração','Enviado','Aprovado','Em andamento','Concluído','Recusado'].map(s=>'<option '+(s===e.status?'selected':'')+'>'+s+'</option>').join('')+'</select><h3>Propostas de orçamento</h3><div id="options"></div><button type="button" onclick="addOption()">＋ Adicionar opção</button>'+field('prazo','Prazo de entrega',e.prazo??'Até 15 dias úteis')+field('pagamento','Condições de pagamento',e.pagamento||'',true)+field('observacoes','Observações',e.observacoes??'Válido por 10 dias.',true)+'<div class="actions"><button class="primary" onclick="save()">Salvar orçamento</button><button onclick="save()&&printBudget(current.id)">Pré-visualizar orçamento</button><button onclick="home()">Voltar</button></div></div>';renderOptions()}
function captureOptions(){current.options=current.options.map((o,i)=>({servico:document.getElementById('servico'+i)?.value??o.servico,material:document.getElementById('material'+i)?.value??o.material,valor:document.getElementById('valor'+i)?.value??o.valor}))}
function renderOptions(){document.getElementById('options').innerHTML=current.options.map((o,i)=>'<div class="option"><h3>Orçamento '+(i+1)+'</h3>'+field('servico'+i,'Serviço a ser realizado',o.servico,true)+field('material'+i,'Material / tecido / cor / quantidade',o.material,true)+field('valor'+i,'Valor total (R$)',o.valor,false,false)+'</div>').join('')}
function addOption(){captureOptions();current.options.push({servico:'',material:'',valor:''});renderOptions()}
function save(){if(!current)return false;captureOptions();for(const n of ['cliente','telefone','local','endereco','data','status','prazo','pagamento','observacoes'])current[n]=document.getElementById(n).value;if(!current.cliente.trim()){message('Preencha o nome do cliente.');return false}let i=entries.findIndex(e=>e.id===current.id);if(i<0)entries.push(structuredClone(current));else entries[i]=structuredClone(current);persist();message('Orçamento salvo com sucesso.');return true}
let preparedPNG=null;
async function prepareWhatsAppPNG(id){
 const e=entries.find(x=>Number(x.id)===Number(id));if(!e)return;
 const btn=document.getElementById('send-whatsapp-btn');
 preparedPNG=null;
 if(btn){btn.disabled=true;btn.textContent='Preparando PNG...'}
 try{
  if(typeof html2canvas!=='function')throw new Error('Gerador PNG indisponível.');
  const paper=document.getElementById('paper');
  const pages=Array.from(paper.querySelectorAll('.pdf-page'));
  if(!pages.length)throw new Error('Pré-visualização não encontrada.');
  const files=[];
  for(let i=0;i<pages.length;i++){
   const copy=pages[i].cloneNode(true);
   const stage=document.createElement('div');
   stage.id='paper';stage.className='preview-active';
   stage.style.cssText='position:fixed;left:0;top:0;width:794px;z-index:-1;pointer-events:none;overflow:visible';
   copy.classList.add('png-export-page');
   stage.appendChild(copy);document.body.appendChild(stage);
   let canvas;
   try{canvas=await html2canvas(copy,{scale:1.15,backgroundColor:'#ffffff',useCORS:true,windowWidth:900})}
   finally{stage.remove()}
   const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
   if(!blob||blob.size<1000)throw new Error('Falha ao gerar PNG.');
   const name='Orcamento-'+e.id+(pages.length>1?'-Opcao-'+(i+1):'')+'-Maresias.png';
   files.push(new File([blob],name,{type:'image/png'}));
  }

  if(!document.getElementById('send-whatsapp-btn'))return;
  preparedPNG={id,files};
  if(btn){btn.disabled=false;btn.textContent='🖼️ Enviar PNG via WhatsApp'}
 }catch(err){
  if(btn){btn.disabled=false;btn.textContent='↻ Preparar PNG novamente'}
  message('Não foi possível preparar PNG: '+err.message);
 }
}
function sendWhatsApp(id){
 const e=entries.find(x=>Number(x.id)===Number(id));if(!e)return;
 if(!preparedPNG||Number(preparedPNG.id)!==Number(id)){
  prepareWhatsAppPNG(id);
  message('Preparando PNG. Aguarde o botão ficar disponível e toque novamente.');
  return;
 }
 const files=preparedPNG.files;
 const msg='Olá, '+e.cliente+'! Segue seu orçamento.';
 window.maresiasLastShareMessage=msg;
 if(navigator.share&&navigator.canShare&&navigator.canShare({files})){
  navigator.share({files,title:'Orçamento '+e.id,text:msg}).then(()=>{
   const confirm=document.getElementById('send-confirm');
   if(confirm)confirm.classList.remove('hidden');
   message('PNG compartilhado. Confirme após enviar ao cliente. Se a frase faltar, use Copiar mensagem.');
  }).catch(err=>{if(err.name!=='AbortError')message('Não foi possível abrir o compartilhamento: '+err.message+'. Use Salvar PNG.')});
  return;
 }
 message('Compartilhamento de arquivos indisponível neste navegador. Toque em Salvar PNG para anexar no WhatsApp.');
}
function saveWhatsAppPNG(id){
 if(!preparedPNG||Number(preparedPNG.id)!==Number(id)){prepareWhatsAppPNG(id);return}
 preparedPNG.files.forEach(file=>{
  const url=URL.createObjectURL(file),a=document.createElement('a');
  a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
 });
 message('PNG salvo. Abra o WhatsApp e anexe a imagem ao cliente.');
}
async function copyWhatsAppMessage(){const msg=window.maresiasLastShareMessage;if(!msg)return;try{await navigator.clipboard.writeText(msg);message('Mensagem copiada! Cole no WhatsApp.')}catch(_){window.prompt('Copie a mensagem:',msg)}}
function confirmWhatsApp(id){
 if(!confirm('Você enviou o orçamento ao cliente pelo WhatsApp?'))return;
 const e=entries.find(x=>Number(x.id)===Number(id));if(!e)return;
 e.status='Enviado';e.enviadoEm=new Date().toISOString();persist();printBudget(id);
 message('Status atualizado para Enviado em '+new Date(e.enviadoEm).toLocaleString('pt-BR'));
}
function printBudget(id){
 const e=entries.find(x=>Number(x.id)===Number(id));if(!e)return;
 const capitalize=v=>String(v??'').replace(/(^|[.!?]\s+|\n\s*)([a-zà-öø-ÿ])/g,(m,p,c)=>p+c.toLocaleUpperCase('pt-BR'));
 const txt=v=>esc(capitalize(v)).replace(/\n/g,'<br>');
 const lines=v=>{const rows=String(v||'').split('\n');return rows.filter(r=>r.trim()).map(r=>'<div class="pdf-line">'+txt(r)+'</div>').join('')};
 const dateBR=v=>{const m=String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?m[3]+'/'+m[2]+'/'+m[1]:esc(v||'')};
 const money=v=>{let n=String(v||'').replace(/[^\d,.-]/g,'');if(n.includes(','))n=n.replace(/\./g,'').replace(',','.');const num=Number(n);return Number.isFinite(num)?num.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}):esc(v||'0,00')};
 const options=e.options?.length?e.options:[{servico:'',material:'',valor:''}];
 document.getElementById('paper').innerHTML=options.map((o,i)=>'<article class="pdf-page"><div class="pdf-top"><h1>MARESIAS RESTAURAÇÕES DE ESTOFADOS</h1><div>ORÇAMENTO Nº '+esc(e.id)+(options.length>1?' — OPÇÃO '+(i+1):'')+'</div></div><div class="pdf-client"><b>Cliente:</b> '+esc(e.cliente)+'<br><b>Data:</b> '+dateBR(e.data)+'<br><b>Local:</b> '+esc(capitalize(e.local||''))+'</div><div class="pdf-section"><h3>DESCRIÇÃO DOS SERVIÇOS</h3>'+lines(o.servico)+'</div><div class="pdf-section"><h3>MATERIAIS</h3>'+lines(o.material)+'</div><div class="pdf-section"><h3>CONDIÇÕES DE PAGAMENTO</h3>'+lines(e.pagamento)+'</div><div class="pdf-notes"><div><b>OBSERVAÇÕES:</b> '+txt(e.observacoes??'Válido por 10 dias.')+'</div><div><b>PRAZO PREVISTO DE ENTREGA:</b> '+txt(e.prazo??'Até 15 dias úteis')+'</div></div><div class="pdf-total"><span>TOTAL (MATERIAIS + MÃO DE OBRA)</span><strong>R$ '+money(o.valor)+'</strong></div><footer class="pdf-footer"><b>MARESIAS RESTAURAÇÕES DE ESTOFADOS</b><div>Alceu: (12) 99631-9697</div><div>Nelson: (12) 98215-8826</div></footer></article>').join('');
 document.getElementById('view').innerHTML='<div class="panel preview-toolbar"><h2>Pré-visualização do orçamento Nº '+esc(e.id)+'</h2><p>Confira o orçamento antes de salvar em PDF.</p><div class="actions"><button onclick="edit('+Number(e.id)+')">← Voltar e editar</button><button class="primary" onclick="window.print()">Salvar em PDF</button><button style="background:#168447;color:#fff" id="send-whatsapp-btn" onclick="sendWhatsApp('+Number(e.id)+')">🖼️ Enviar PNG via WhatsApp</button><button onclick="saveWhatsAppPNG('+Number(e.id)+')">💾 Salvar PNG</button><button onclick="copyWhatsAppMessage()">📋 Copiar mensagem</button><button onclick="home()">Orçamentos</button></div><div id="send-confirm" class="hidden"><p>Após enviar a imagem e a mensagem pelo WhatsApp:</p><button class="primary" onclick="confirmWhatsApp('+Number(e.id)+')">✓ Confirmar envio realizado</button></div></div>';
 document.getElementById('paper').classList.add('preview-active');
 document.getElementById('paper').scrollIntoView({behavior:'smooth',block:'start'});
 setTimeout(()=>prepareWhatsAppPNG(id),100);
}
function settings(){document.getElementById('paper').classList.remove('preview-active');document.getElementById('view').innerHTML='<div class="panel"><h2>Dados da empresa</h2>'+field('companyPhone','Telefone / WhatsApp',config.telefone||'',false,false)+field('companyAddress','Endereço para rodapé',config.endereco||'',true,false)+'<div class="actions"><button class="primary" onclick="config={telefone:document.getElementById(\'companyPhone\').value,endereco:document.getElementById(\'companyAddress\').value};localStorage.setItem(CFG,JSON.stringify(config));home()">Salvar</button></div></div>'}
function backup(){let blob=new Blob([JSON.stringify({entries,config},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-tapecaria-maresias.json';a.click();URL.revokeObjectURL(a.href)}
function importBackup(inp){let f=inp.files?.[0];if(!f)return;f.text().then(t=>{let d=JSON.parse(t);if(!Array.isArray(d.entries)||!confirm('Importar backup e substituir os dados deste aparelho?'))return;entries=d.entries;config=d.config||{};persist();localStorage.setItem(CFG,JSON.stringify(config));home()}).catch(()=>message('Arquivo de backup inválido.'))}
home();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
</script></body></html>
